name: ZIP de extensiones
on:
  push:
    branches: [main]
    paths:
      - 'Aviso IA/**'
      - 'Auto Sigue/**'
      - '.github/workflows/descargas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar los ZIP de descarga directa
        run: |
          mkdir -p Descargas
          rm -f Descargas/Aviso-IA.zip Descargas/Auto-Sigue.zip
          zip -qr Descargas/Aviso-IA.zip "Aviso IA"
          zip -qr Descargas/Auto-Sigue.zip "Auto Sigue" -x 'Auto Sigue/QA/*'
          unzip -t Descargas/Aviso-IA.zip
          unzip -t Descargas/Auto-Sigue.zip
      - name: Publicar descargas en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Descargas/Aviso-IA.zip Descargas/Auto-Sigue.zip
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar ZIP de las extensiones"
            git push
          fi
